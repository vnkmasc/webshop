spring:
  application:
    name: shop-backend
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: shop-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    remoteip:
      internal-proxies: ${APP_TRUSTED_PROXY:127\.0\.0\.1|::1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,simulation
  info:
    env:
      enabled: true

info:
  release:
    version: ${APP_RELEASE_VERSION:dev}
    stage: ${APP_RELEASE_STAGE:local}

app:
  seed-enabled: ${APP_SEED_ENABLED:false}
  simulation-enabled: ${APP_SIMULATION_ENABLED:false}
  admin-email: ${APP_ADMIN_EMAIL:admin@saibuoc.vn}
  admin-password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl: PT8H
  shipping:
    fee: 30000
    free-from: 1000000
  payment:
    url: ${PAYMENT_URL:http://127.0.0.1:8090}
    api-key: ${PAYMENT_API_KEY:}
    connect-timeout: PT2S
    read-timeout: ${PAYMENT_READ_TIMEOUT:PT8S}
  risk:
    url: ${APP_RISK_URL:}
    api-key: ${RISK_API_KEY:}
    timeout: ${RISK_TIMEOUT:PT3S}

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}] [uid=%X{userId:-}]"
  level:
    root: INFO
    vn.saibuoc: INFO

---
spring:
  config:
    activate:
      on-profile: local
app:
  seed-enabled: ${APP_SEED_ENABLED:true}
  simulation-enabled: ${APP_SIMULATION_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    name: ${LOG_FILE:/var/log/shop/backend.log}
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 50MB
