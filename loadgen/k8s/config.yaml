# Load level, read by every load generator pod. The values are PER POD: with 2 replicas the shop gets
# twice the users and orders below. deploy.sh applies this file only when the ConfigMap does not exist yet,
# so a level set with "kubectl edit" or "kubectl patch" survives redeploys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-loadgen
  namespace: shop-loadgen
data:
  BASE_URL: http://shop.example.com
  PROFILE: steady
  DURATION: 8760h
  # Background level per pod. Demo level per pod: VUS=5, BUY_PERCENT=25, ORDERS_PER_MIN=5.
  VUS: "1"
  BUY_PERCENT: "2"
  ORDERS_PER_MIN: "1"
  CARD_PERCENT: "50"
