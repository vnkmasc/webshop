# Load generator on Kubernetes: one pod per node (2 replicas, spread over nodes that accept regular pods).
# Deploy with ./deploy.sh, which also creates the ConfigMap (config.yaml) and the secret.
apiVersion: v1
kind: Namespace
metadata:
  name: shop-loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-loadgen
  namespace: shop-loadgen
  labels:
    app: shop-loadgen
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shop-loadgen
  template:
    metadata:
      labels:
        app: shop-loadgen
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: shop-loadgen
      containers:
        - name: k6
          image: shop-loadgen:latest
          envFrom:
            - configMapRef:
                name: shop-loadgen
            - secretRef:
                name: shop-loadgen
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
