spring:
  application:
    name: payment-gateway
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payments}
    username: ${PAYMENT_DB_USER:payments}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      pool-name: payment-pool
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  address: ${PAYMENT_BIND_ADDRESS:127.0.0.1}
  port: ${PAYMENT_PORT:8090}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  release:
    version: ${APP_RELEASE_VERSION:dev}
    stage: ${APP_RELEASE_STAGE:local}

gateway:
  api-key: ${PAYMENT_API_KEY:}

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    name: ${PAYMENT_LOG_FILE:/var/log/shop/payment.log}
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 50MB
